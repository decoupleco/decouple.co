/* Pairs Pro studies: one μi component layer, twenty visual directions. */
body{background:#f2f3ee;color:#202820;font:14px/1.5 Arial,sans-serif}

</style></head><body><div id="root"></div><dialog id="dialog" class="studio-dialog" aria-label="Design preview dialog"></dialog><div id="toast" class="toast" role="status" hidden></div><noscript>This design study requires JavaScript to render its local, offline demo screens.</noscript><script>window.STUDY_THEMES=[{"id":"01-ledger","name":"Quiet Ledger","type":"Private finance","layout":"ledger","rank":1,"line":"A clear view of capital, without the noise.","fit":"Best overall balance of trust, warmth and financial precision.","colors":["#f3f3ed","#ffffff","#182c26","#4e6159","#1c6149","#ffffff","#e8eee7","#cdd8ce","#126445","#8c3f28"],"font":"Arial, sans-serif","display":"Georgia, serif","radius":16,"traits":["Warm white","Serif numerals","Quiet hierarchy"],"brief":"Design a calm private-finance instrument. Use warm white, forest ink and restrained emerald. Give portfolio value a serif display treatment; keep units, tables and inputs in a clean sans. Lead with personal capital and time-qualified change, then show holdings as spacious rows. Use subtle panel boundaries, 16px corners, flat surfaces and a small allocation strip. Desktop should feel like a well-edited financial workspace. Avoid luxury ornament, gold trim and marketing slogans."},{"id":"02-blueprint","name":"Blueprint","type":"Strategy research","layout":"matrix","rank":4,"line":"Every range has a reason.","fit":"For users who want to understand and inspect the strategy.","colors":["#edf2fa","#ffffff","#172c4d","#50627c","#234fbe","#ffffff","#e6edfa","#c6d2e7","#15634c","#a44529"],"font":"Arial, sans-serif","display":"Arial, sans-serif","radius":3,"traits":["Technical grid","Indexed modules","Blue rules"],"brief":"Make a precise strategy-research notebook in ink blue and white. Use square panels, numbered sections, narrow technical captions and monospaced secondary figures. Organize the portfolio as a matrix of value, return and allocation, with a full-width chart below. Show price bands as measured intervals rather than decorative gradients. Put data-source context in a fixed caption, not everywhere. Desktop configuration is a structured instrument panel, with preview next to inputs. Avoid cyan glow, illegible graph-paper texture and microscopic labels."},{"id":"03-orchard","name":"Orchard","type":"Personal wealth","layout":"companion","rank":2,"line":"Liquidity that is easier to live with.","fit":"The most approachable direction for an everyday holder.","colors":["#f2f5ef","#ffffff","#223728","#566657","#416b32","#ffffff","#e6eedf","#cfdbca","#396526","#944329"],"font":"\"Trebuchet MS\", Arial, sans-serif","display":"\"Trebuchet MS\", Arial, sans-serif","radius":24,"traits":["Humanist type","Generous spacing","Allocation ring"],"brief":"Create an approachable wealth companion using white, soft sage and deep olive. Use generous spacing and rounded, flat panels with a distinctly humanist type voice. Put an allocation ring beside the portfolio value. Show three digestible holdings, not a wall of KPIs. Pair every chart with a plain-language interpretation and preserve exact quantities in the transaction flow. Desktop is calm and broad, with a clear action rail. Avoid cartoon illustrations, gamified yield, pastel low contrast and oversized empty cards."},{"id":"04-ticker","name":"Ticker","type":"Trading terminal","layout":"terminal","rank":7,"line":"The market, with a position in it.","fit":"A credible dense option for active, experienced LPs.","colors":["#101715","#151f1b","#e3eee5","#a1b6a8","#b7e577","#15210d","#213128","#354a3e","#b7e577","#ffb49c"],"font":"\"SFMono-Regular\", Consolas, monospace","display":"Arial, sans-serif","radius":4,"traits":["Dark terminal","Tabular figures","Compact rows"],"brief":"Build a disciplined dark trading terminal. Use charcoal green, pale ink and one muted lime action color. Make portfolio rows and price charts the dominant language, with a compact NAV header and aligned numeric columns. Keep all touch targets at least 44px even when visual spacing is dense. Use a segmented instrument header, small status lamps with text labels and shallow corners. Desktop gets a technical side rail and a large price canvas. No CRT effects, scanlines, blinking values, neon bloom or invented live feeds."},{"id":"05-folio","name":"Folio","type":"Financial editorial","layout":"editorial","rank":5,"line":"Capital, in perspective.","fit":"A distinctive alternative with strong reading hierarchy.","colors":["#f5f0e7","#fffdf8","#302a26","#716258","#9a3c29","#ffffff","#eee5d8","#d8cbbb","#36624c","#9a3c29"],"font":"Arial, sans-serif","display":"Georgia, serif","radius":0,"traits":["Editorial serif","Ruled sections","Warm paper"],"brief":"Treat Pairs Pro as a beautifully edited financial journal that is still a working app. Use warm paper, charcoal and a restrained terracotta action. Serif section titles and large value figures contrast with precise sans-serif controls. Replace nested cards with horizontal rules and numbered sections. Place asset names and quantities on generous baseline-aligned rows. The desktop workspace should read as a two-column financial spread. Avoid faux paper textures, decorative quotations and large narrative blocks that delay a transaction."},{"id":"06-atlas","name":"Atlas","type":"Research workspace","layout":"research","rank":6,"line":"A workspace for every position.","fit":"Useful for analytical users moving between pools and contexts.","colors":["#f1f2f7","#ffffff","#24283f","#5b6079","#5351ae","#ffffff","#ececf6","#d3d4e2","#206548","#9e4232"],"font":"Arial, sans-serif","display":"Arial, sans-serif","radius":10,"traits":["Workspace rail","Context breadcrumbs","Notebook panels"],"brief":"Create an analytical research workspace with white panels, slate typography and quiet indigo. Put context breadcrumbs and a slim vertical accent next to important numbers. Portfolio overview should pair value and a compact trend, followed by a single clean holdings panel. Desktop uses a permanent workspace rail, contextual tabs and a right-hand position summary. Configuration retains its four semantic groups, with changed values easy to inspect. Avoid generic SaaS statistic tiles, excessive chips and nesting every row in its own card."},{"id":"07-swiss","name":"Index","type":"Swiss financial instrument","layout":"swiss","rank":3,"line":"Nothing between you and the numbers.","fit":"The sharpest minimal option, with the least decorative weight.","colors":["#f4f4f2","#ffffff","#191919","#60605c","#222222","#ffffff","#eeeeea","#cececa","#255c45","#a43c2e"],"font":"Arial, Helvetica, sans-serif","display":"Arial, Helvetica, sans-serif","radius":0,"traits":["Black and white","Strong alignment","No card chrome"],"brief":"Apply a Swiss editorial grid to a real liquidity-management app. Use white, black, disciplined alignment and almost no rounding. Establish hierarchy with size, spacing and rules, not colored containers. Portfolio value is oversized but compact; the return figure is anchored on the same grid. Holdings are a ruled ledger. Charts are monochrome with patterned bands and textual legends. Reserve semantic colors for positive, warning and error states. Desktop is a wide financial instrument with visible column structure. Avoid brutalist thick borders and decorative giant typography."},{"id":"08-nocturne","name":"Nocturne","type":"Night portfolio","layout":"night","rank":8,"line":"A quieter view after hours.","fit":"A softer dark mode for monitoring rather than trading.","colors":["#101923","#17232f","#e9eff4","#a8bacb","#a9c8ed","#112034","#243546","#3d5268","#9bd7bb","#ffb7a6"],"font":"Arial, sans-serif","display":"Georgia, serif","radius":18,"traits":["Deep navy","Soft blue","Low visual noise"],"brief":"Design an elegant night portfolio with deep navy surfaces and readable silver-blue text. Use a serif portfolio figure and modest rounded containers. The hero should be a quiet text block above a luminous but restrained line chart, with value details on dark cards below. Keep charts, transaction amounts and minimum outputs readable in low light. Desktop uses layered flat surfaces rather than glass. Avoid purple gradients, transparent cards, stars, glow and washed-out text."},{"id":"09-signal","name":"Signal","type":"Operations cockpit","layout":"operations","rank":9,"line":"A clear signal. A bounded action.","fit":"Best for a manager-oriented or operations-heavy product.","colors":["#f0f2f1","#ffffff","#1b2b32","#54646c","#a94a20","#ffffff","#e6ebea","#cbd6d3","#176146","#a64030"],"font":"Arial, sans-serif","display":"\"SFMono-Regular\", Consolas, monospace","radius":5,"traits":["Status-first","Amber actions","Control-room grid"],"brief":"Build an operations cockpit that makes state and consequences obvious. Use near-white panels, dark blue-grey and burnt-orange action accents. Begin with a compact status strip, then place the main value on a hard-aligned numeric grid. Use base and limit exposure bars as a recurring organizing device. Desktop separates observe, preview and apply. Config review must distinguish saving parameters from a later keeper allocation. Avoid alarm fatigue, treating green as a safety guarantee, and exposing manager controls to a holder."},{"id":"10-tide","name":"Tide","type":"Modern brokerage","layout":"broker","rank":10,"line":"An open view of your liquidity.","fit":"A familiar, polished brokerage-style baseline.","colors":["#eef3f9","#ffffff","#172d48","#52657c","#1764c0","#ffffff","#e4edf9","#cbd7e6","#176747","#aa432e"],"font":"\"Trebuchet MS\", Arial, sans-serif","display":"\"Trebuchet MS\", Arial, sans-serif","radius":14,"traits":["Native-app rhythm","Blue action rail","Clear panels"],"brief":"Design a modern brokerage-style LP app in white and confident blue. Use an app-like header, a broad value card and clean grouped rows. Favor easy thumb reach, large numeric inputs and a predictable navigation bar. Bring a small allocation graphic into the value card and use a pale-blue strip to group the user position on the pool screen. Desktop combines a substantial chart with a sticky action card. Avoid sales banners, promotional APY, stock photography and dashboard-card repetition."},{"id":"11-margin","name":"Margin","type":"Financial statement","layout":"statement","rank":11,"line":"The whole position, in one reading.","fit":"A disciplined alternative for people who prefer statements to dashboards.","colors":["#f5f0ef","#ffffff","#352329","#6d5960","#843448","#ffffff","#efe4e7","#d9c9ce","#276247","#a33f2e"],"font":"Arial, sans-serif","display":"Georgia, serif","radius":2,"traits":["Statement columns","Burgundy margin","Ruled totals"],"brief":"Design a contemporary financial statement, not a dashboard. Use white, burgundy ink and a narrow margin rule. Put a numbered statement header above the portfolio total, then place the 30-day change on its own ruled line. Holdings read as ledger entries; a small margin label identifies each section. Pool cards become numbered horizontal records. Desktop has a restrained statement index instead of a heavy navigation slab. Give transaction totals receipt-like emphasis. Avoid legal-document density, tiny footnotes and ornamental seals."},{"id":"12-estuary","name":"Estuary","type":"Treasury overview","layout":"treasury","rank":12,"line":"Know where every part is working.","fit":"Emphasizes allocation across positions with a quieter treasury character.","colors":["#edf4f2","#ffffff","#193c39","#506c68","#146c62","#ffffff","#e0efeb","#c6dbd5","#236849","#a54431"],"font":"Arial, sans-serif","display":"Arial, sans-serif","radius":12,"traits":["Allocation ladder","Teal contours","Open rows"],"brief":"Create a light treasury overview using white and deep teal. Beneath the portfolio total, show three labelled horizontal allocation bars with amounts; this allocation ladder is the visual signature, not a ring or a large colored card. Keep section headings short and rows open. Use thin contour-like chart rules and a quiet pale-teal chart bed. Desktop places a tidy treasury summary beside a broad plot. Settings should use flat grouped panels and a strong preview edge. Avoid ocean imagery, wave decorations and pretending this is cash management."},{"id":"13-studio","name":"Studio","type":"Curated investment workspace","layout":"curated","rank":13,"line":"A considered place for your positions.","fit":"A more expressive visual identity without crowding financial content.","colors":["#f2f0f6","#ffffff","#322a44","#655d76","#69529b","#ffffff","#ebe6f2","#d3cbe0","#386547","#a14333"],"font":"Arial, sans-serif","display":"Georgia, serif","radius":8,"traits":["Typographic masthead","Lilac side note","Asymmetric modules"],"brief":"Design a curated investment studio: white, aubergine ink and muted lilac. Use a distinctive serif value on a broad typographic stage with an offset annotation column for period and change. Let white space and asymmetry establish hierarchy, while exact figures stay aligned. Holdings get small numbered labels rather than boxed KPIs. Pool detail keeps a large clean plotting area with a slim caption column. Desktop mixes one open canvas with a compact lilac action panel. Avoid art-gallery marketing copy, abstract sculptures and layouts that sacrifice readable transaction data."},{"id":"14-circuit","name":"Circuit","type":"Quant workstation","layout":"quant","rank":14,"line":"Observe the position. Read the change.","fit":"A cool, structured dark direction for data-oriented LPs.","colors":["#0d1920","#13232c","#e3f0f3","#a1bbc5","#89d9dd","#10292c","#203640","#34515d","#a1d7b5","#ffb7a3"],"font":"Arial, sans-serif","display":"\"SFMono-Regular\", Consolas, monospace","radius":0,"traits":["Dark split matrix","Cyan rails","Measured charts"],"brief":"Build a quant workstation in graphite blue with subdued cyan. The portfolio hero is a split numeric matrix: a large net value cell above a pair of clearly labelled delta cells. Use monospaced figures but readable sans-serif prose and 44px controls. Organize holdings as precision rows with a strong left edge. Chart modules have a measurement-rail treatment; desktop gives the plot maximum width and keeps actions compact. Config is a restrained two-column instrument. No neon, code rain, fake terminal logs, blinking lamps or decorative complexity."},{"id":"15-kiln","name":"Kiln","type":"Independent finance","layout":"craft","rank":15,"line":"Clear figures. A little more character.","fit":"Warm and practical, with a recognizable identity beyond standard fintech.","colors":["#f5f0e9","#fffcf7","#3b2b22","#746153","#98492a","#ffffff","#eee2d2","#d8c7b4","#466329","#a13d2f"],"font":"\"Trebuchet MS\", Arial, sans-serif","display":"Georgia, serif","radius":10,"traits":["Warm inset statement","Clay rules","Tab-like headings"],"brief":"Create an independent-finance product with warm ivory, brown ink and clay accents. Use a softly inset portfolio statement: small heading, large serif total, then a crisp return line and an understated allocation strip. Section headings resemble simple index tabs. Holdings and pool rows use warm rules, not repeated shadow cards. The deposit review should feel like a clear, carefully typeset receipt. Desktop keeps this warmth but uses an exact grid and compact side summary. Avoid handmade textures, craft illustrations and rounded shapes without a functional purpose."},{"id":"16-paper","name":"Paper","type":"Investment digest","layout":"digest","rank":16,"line":"Your liquidity, clearly reported.","fit":"A reading-first direction for occasional portfolio check-ins.","colors":["#f1f1ec","#fffffc","#252a28","#60675f","#445b46","#ffffff","#e8ede3","#cdd5c7","#2d6441","#a33d2d"],"font":"Georgia, serif","display":"Georgia, serif","radius":0,"traits":["Digest masthead","Two-column figures","Fine rules"],"brief":"Make an investment digest that behaves like a working app. Use near-white paper, dark green-black type and very thin rules. A serif masthead introduces two portfolio columns: current value and time-qualified change. Controls, units and compact tables stay in sans-serif. Holdings resemble an edited financial bulletin with clear line spacing. Pool detail pairs a strong price heading with an open chart. Desktop reads as a financial spread with an actionable right column. Avoid long articles, multi-column body prose on mobile, fake paper grain and newspaper gimmicks."},{"id":"17-vector","name":"Vector","type":"Allocation instrument","layout":"instrument","rank":17,"line":"Position, direction, proportion.","fit":"Makes allocation a first-class visual language for a strategy product.","colors":["#eef1f5","#ffffff","#233348","#58677a","#355f97","#ffffff","#e4ebf4","#c9d4e2","#2a654b","#a4432e"],"font":"Arial, sans-serif","display":"Arial, sans-serif","radius":4,"traits":["Segmented allocation","Instrument labels","Wide chart plane"],"brief":"Design a precise allocation instrument in white, slate and steel blue. Put the portfolio total above a wide segmented exposure bar; label each segment beneath it with token, proportion and value. Use crisp technical labels sparingly and flat, shallow components. Holdings have a subtle column ruler and pool rows expose the most relevant comparison figures. Desktop should feel like a broad instrument plane with a compact action dock. Range previews reuse the same allocation grammar. Avoid aircraft gauges, dials and metaphor-heavy controls."},{"id":"18-grove","name":"Grove","type":"Nordic wealth workspace","layout":"nordic","rank":18,"line":"Less surface. More understanding.","fit":"A quiet open-layout option with little card furniture.","colors":["#f2f3eb","#ffffff","#313b28","#59664e","#546b31","#ffffff","#e8eddc","#d0d8c2","#3d642c","#9e4230"],"font":"Arial, sans-serif","display":"Georgia, serif","radius":6,"traits":["Open whitespace","Olive hairlines","Side-aligned change"],"brief":"Create a Nordic wealth workspace with white, pale olive and earthy ink. Use open whitespace instead of containers. The portfolio total is large and left aligned; a smaller return annotation sits below a long hairline with a modest three-pool marker. Put holdings on generous, unboxed rows and use a narrow label column to organize detail. Desktop gets an unusually quiet rail and a broad open chart area. Settings groups are separated by spacing and headings, not nested cards. Avoid botanical drawings, lifestyle imagery and excessive empty space that pushes the action away."},{"id":"19-cobalt","name":"Cobalt","type":"Digital asset banking","layout":"bank","rank":19,"line":"A confident home for your liquidity.","fit":"A bold but controlled identity with unmistakable action hierarchy.","colors":["#edf1fa","#ffffff","#1e3153","#566782","#244dc4","#ffffff","#e4ebfa","#cad5ee","#23664b","#aa4331"],"font":"Arial, sans-serif","display":"Arial, sans-serif","radius":18,"traits":["Cobalt value panel","Stacked account rows","Compact summary rail"],"brief":"Design a confident digital-asset banking interface. Use a single solid cobalt portfolio panel with white figures, an understated account label and a compact 30-day return strip. Surround it with clean white space. Holdings use stacked account-like rows with amounts flush right; pool cards become orderly groups. Desktop uses one blue action summary beside a neutral chart, not a blue background everywhere. Keep form inputs large and exact. Avoid generic bank-card illustrations, glossy gradients, floating coins and trust claims implied by banking language."},{"id":"20-relay","name":"Relay","type":"Task-first finance","layout":"planner","rank":20,"line":"A clear view. A clear next step.","fit":"For a product organized around check, understand and act.","colors":["#f2f0f7","#ffffff","#332d48","#6a607d","#6950a0","#ffffff","#ece6f5","#d5cce3","#32664b","#a44334"],"font":"\"Trebuchet MS\", Arial, sans-serif","display":"Arial, sans-serif","radius":12,"traits":["Task sequence","Split summary","Violet step markers"],"brief":"Create a task-first financial workspace in white, ink and restrained violet. A small three-step sequence, Observe / Understand / Act, anchors the portfolio before a split summary of value and period change. Keep steps descriptive, never a fake completion meter. Holdings and pool rows use a simple left marker to guide scanning. Transaction screens make input, review and completion visibly distinct. Desktop configuration follows the same grouped-task rhythm with preview adjacent. Avoid checklist clutter, gamification, excessive pills and making routine monitoring look like unfinished work."}];window.STUDY_ID="08-nocturne";window.STUDY_PROMPT="Create a high-fidelity Pairs Pro product design study, not a landing page. Use the existing μi HTML/CSS component layer (buttons, fields, tabs, segments, panels and numeric styles); do not introduce React Material UI or a second component framework. Deliver one self-contained HTML file containing five 390px mobile screens and two 1440px desktop screens, with inline CSS, JavaScript and SVG. It must open offline, without a server, external fonts, images, CDNs or wallets.\n\nUse the same seven screens, content and deterministic sample data in every variant: M01 Portfolio, M02 Pools, M03 Pool detail, M04 Deposit review, M05 Withdraw, D01 Pool workspace, D02 Strategy settings. Preserve a coherent flow from monitoring through pool selection, inspection and transaction review. Portfolio is the primary daily-use screen. Mobile must work at 360px as well as 390px. Desktop chart plus position sidebar must remain visually distinct from the manager configuration form.\n\nAll money and charts are illustrative and visibly labelled Demo. Distinguish market/pool TVL from vault TVL and the user's position; estimated APY from realized returns; immediate withdrawal from queued requests; and projected bands from sample allocation history. Show units and percentages together. Never call an estimate guaranteed or claimable unless the state supports it. Keep price as the default for base/limit ranges and provide an accessible price/tick toggle. Put source, block and kind in an accessible disclosure instead of repeating metadata beside every figure.\n\nKeep manager actions outside ordinary holder flows. A holder can withdraw without a deposit role. Model wrong-network and history-unavailable states; missing history must not hide a separately available withdrawal quote. Review screens expose exact approvals, minimum outputs/shares, fee and deadline. Configuration groups are Anchor, Range, Weight, Exposure; one base-weight slider controls the complementary limit weight. A config save is not an allocation transaction. Confirmations are prototype-only and never connect to a wallet or send a transaction.\n\nRevision 2 layout contract: keep the twenty directions. Use DEX and network dropdowns on Pools. Put WETH price, vault TVL, pool TVL, estimated APY and vault fees in one header metrics bar; stack it compactly on mobile. Put Base in range inside a Blocks-style position card with identity, min/current/max range, three aligned information rows and actions. Use Withdraw as the visible exit label. Put Show range below the chart, right aligned. Period controls use compact underline tabs with 44px hit areas. Distinguish base/limit identity from keeper/projected provenance.\n\nRevision 3: amount inputs share a flat card surface, with visible focus around the whole card instead of a nested numeric rectangle. Every position card has an explicit border. On desktop, move the compact vault table to the sidebar and reserve the primary column below the price chart for two secondary panels: Position value / Exposure, and Fees / Price per share. Stack these panels on mobile. Exposure is WETH as a share of USD position value; fees are cumulative vault fees for the selected period. Keep personal values distinct from whole-vault balances.\n\nUse semantic HTML, real labels, keyboard focus, at least 44px touch targets, non-color status cues and readable contrast. Give each screen one dominant action. Avoid tiny mono copy, giant empty tiles, gratuitous gradients, glossy crypto visuals, fake live data and hover-only essential information. Charts, toggles, filters, amount inputs, transaction review, range units and configuration previews must respond meaningfully. Respect reduced motion. Change visual hierarchy, module composition, density and typography for the chosen direction—not merely the accent color.";

  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const money = (n, d=2) => Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
  const fmt = (n,d=2) => Number(n).toLocaleString('en-US',{maximumFractionDigits:d});
  const value = 12480.22;
  const ownValue = 8400;
  const price = 2431.50;
  const pps = 1.7154;

  const redeemBalance = Math.floor(poolShares * 10000) / 10000;
  const fullBase = ownValue / 2 / price;
  const fullQuote = ownValue / 2;
  const configDefaults = { base:5, limit:3, chase:67, weight:80, target:50, tolerance:30 };
  const screenNames = {m01:'Portfolio',m02:'Pools',m03:'Pool detail',m04:'Deposit',m05:'Withdraw',d01:'Pool workspace',d02:'Strategy settings'};
  const iconPaths = {
    arrow:'M4 10h12m-5-5 5 5-5 5', back:'M15 10H4m5-5-5 5 5 5',
    portfolio:'M3 6h14v11H3zM7 6V3h6v3M3 10h14M8 10v3h4v-3',

    activity:'M2 11h4l3-7 3 12 3-6h3', wallet:'M3 5h13v12H3zM3 5V3h11v2m-2 5h6v4h-6z',
    search:'M8.5 3a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11m4 10 4.5 4.5',
    info:'M10 2a8 8 0 1 0 0 16 8 8 0 0 0 0-16m0 7v5m0-9v1',

  function dialog(titleText,html,label='',callback=null,cls='') {
    const d=document.getElementById('dialog');if(d.open)d.close();
    d.className='studio-dialog '+cls;d.innerHTML=`<div class="dialog-head"><h2>${titleText}</h2><button type="button" class="dialog-close" data-action="close-dialog" aria-label="Close dialog">×</button></div><div class="dialog-copy">${html}</div><div class="dialog-actions"><button type="button" class="studio-button" data-action="close-dialog">${label?'Back':'Close'}</button>${label?`<button type="button" class="studio-button filled" data-action="confirm">${label}</button>`:''}</div>`;confirmAction=callback;d.showModal();
  }
  function numeric(input) {
    const str=String(input.value).replace(/,/g,'').trim();return /^(?:\d+(?:\.\d*)?|\.\d+)$/.test(str)?Number(str):NaN;
  }
  function updateDeposit(frame) {
    const base=numeric(frame.querySelector('[data-amount="WETH"]'));
    const quote=numeric(frame.querySelector('[data-amount="USDC"]'));
    const total=base*price+quote;
    const invalid=!Number.isFinite(total)||base<0||quote<0||total<=0||base>3.1402||quote>12480.22;
    const error=frame.querySelector('[data-deposit-error]');error.textContent=invalid?'Enter amounts within your sample token balances.':'';
    frame.querySelector('[data-deposit-value]').textContent=invalid?'—':'$'+money(total);
    frame.querySelector('[data-deposit-shares]').textContent=invalid?'—':money(total/pps);
    frame.querySelector('[data-deposit-min]').textContent=invalid?'—':money(total/pps*.995);
    for(const token of ['WETH','USDC']) frame.querySelector(`[data-amount-usd="${token}"]`).textContent=Number.isFinite(token==='WETH'?base:quote)?'$'+money(token==='WETH'?base*price:quote):'—';
    const cta=frame.querySelector('[data-action="deposit-review"]');if(cta)cta.disabled=invalid||state.scenario==='holder';
    return invalid?null:{base,quote,total,shares:total/pps,min:total/pps*.995};
  }
  function updateRedeem(frame) {
    const shares=numeric(frame.querySelector('[data-redeem-shares]'));
    const invalid=!Number.isFinite(shares)||shares<=0||shares>redeemBalance;
    const ratio=shares/poolShares;
    frame.querySelector('[data-redeem-error]').textContent=invalid?'Enter shares within your available sample balance.':'';
    frame.querySelector('[data-redeem-percent]').textContent=invalid?'Invalid amount':fmt(ratio*100,1)+'% of your position';
    frame.querySelector('[data-redeem-usd]').textContent=invalid?'—':'$'+money(ownValue*ratio);
    frame.querySelector('[data-receive-base]').textContent=invalid?'—':fmt(fullBase*ratio,4);
    frame.querySelector('[data-receive-quote]').textContent=invalid?'—':money(fullQuote*ratio);
    frame.querySelector('[data-receive-min]').textContent=invalid?'Minimums unavailable':`Minimum ${fmt(fullBase*ratio*.995,4)} WETH + ${money(fullQuote*ratio*.995)} USDC`;
    const cta=frame.querySelector('[data-action="redeem-review"]');if(cta)cta.disabled=invalid||state.redeemMode==='queued';
    return invalid?null:{shares,base:fullBase*ratio,quote:fullQuote*ratio};
  }
  function filterPools(frame) {
    const query=frame.querySelector('[data-pool-search]').value.trim().toLowerCase();
    const selected=frame.querySelector('[data-pool-dex]').value;
    const network=frame.querySelector('[data-pool-network]').value;
    let count=0;
    frame.querySelectorAll('[data-pool-list] .pool-card').forEach(row=>{const show=(selected==='All'||row.dataset.dex===selected)&&(network==='All'||row.dataset.network===network)&&row.dataset.search.toLowerCase().includes(query);row.hidden=!show;if(show)count++;});
    frame.querySelector('[data-pool-count]').textContent=count+' pool'+(count===1?'':'s');frame.querySelector('[data-no-pools]').hidden=count!==0;
  }
  function navigate(id) {
    if(!current){location.href=themes[0].id+'.html#'+id;return;}
    state.focus=id;history.replaceState(null,'','#'+id);mount();window.scrollTo({top:0,behavior:'instant'});
  }
  function updateChart(panel) {
    const mode=panel.querySelector('[data-chart-type]').value;
    const period=panel.querySelector('[data-action="price-period"][aria-pressed="true"]').dataset.period;
    const host=panel.querySelector('[data-price-chart]');host.innerHTML=priceChart(mode,period);
    panel.querySelector('.chart-axis span').textContent=period==='7D'?'13 Oct':period==='30D'?'20 Sep':'20 Jul';
    host.querySelector('.chart-bands').style.display=panel.querySelector('[data-chart-bands]').checked?'':'none';
    panel.closest('[data-frame]').querySelectorAll('[data-secondary-panel]').forEach(p=>updateSecondary(p,p.dataset.secondaryKind,period));
    panel.querySelector('[data-chart-readout]').textContent=`${mode} · ${period} illustrative series · not a live quote.`;
  }
  function updateConfig(root) {
    const values={};root.querySelectorAll('[data-config-input]').forEach(input=>{values[input.dataset.configInput]=Number(input.value);root.querySelector(`[data-output="${input.dataset.configInput}"]`).textContent=input.value+input.dataset.suffix;});
    root.querySelector('[data-base-weight]').textContent=values.weight+'%';root.querySelector('[data-limit-weight]').textContent=(100-values.weight)+'%';root.querySelector('[data-preview-weight]').textContent=values.weight+'% / '+(100-values.weight)+'%';
    root.querySelector('[data-range-base-weight]').textContent=values.weight+'%';root.querySelector('[data-range-limit-weight]').textContent=(100-values.weight)+'%';
    root.querySelector('[data-config-dirty]').innerHTML='Unsaved changes · preview before review<br>Saving config does not execute an allocation.';
    root.querySelector('[data-config-state]').textContent='';return values;
  }
  const reviewHtml = `<p>The existing wireframe is a strong functional inventory, but weak visual prioritization makes it feel more technical than it needs to.</p><div class="review-list"><div><h3>01 · Put the holder before the protocol.</h3><p>Lead with the user's position, return period and next action. Pool TVL, contract addresses and global reserves belong beneath that first reading.</p></div><div><h3>02 · Give data a hierarchy.</h3><p>The current sheet gives metric boxes, labels, metadata and controls almost equal weight. Use a dominant figure, a restrained second tier, and a single accessible source disclosure.</p></div><div><h3>03 · Separate inspect from act.</h3><p>Keep charts and ranges visible to guests. Put deposit and withdrawal in focused flows; put manager configuration in its own workspace.</p></div><div><h3>04 · Make the seven screens one journey.</h3><p>A sheet with 24 role frames is good for specification review. These studies use five mobile tasks and two desktop workspaces to evaluate a coherent product instead.</p></div><div><h3>05 · Stay precise without looking clinical.</h3><p>Price and tick units, projected bands, role limits, minimum outputs and queue states stay explicit. Typography, spacing and grouping do the visual work; nothing relies on a decorative gradient.</p></div></div><p>Shortlist: <strong>Quiet Ledger</strong> for overall balance, <strong>Orchard</strong> for approachability, <strong>Index</strong> for sharp minimalism. These are editorial judgments, not usability-test results.</p>`;
  function showComparison() {
    if(!state.selected.size){toast('Select one to three directions to compare.');return;}
    const cols=themes.filter(t=>state.selected.has(t.id)).map(t=>`<div class="compare-column"><h3>${t.id.slice(0,2)} · ${t.name}</h3>${mobile(t,state.compareScreen)}</div>`).join('');
    dialog('Compare the same task',`<div class="compare-toolbar"><p>Same data, framework and action.<br>Compare hierarchy, type and visual load.</p><select aria-label="Comparison screen" data-comparison-screen>${Object.entries(screenNames).filter(([id])=>id.startsWith('m')).map(([id,name])=>`<option value="${id}" ${id===state.compareScreen?'selected':''}>${id.toUpperCase()} · ${name}</option>`).join('')}</select></div><div class="compare-grid">${cols}</div>`,'',null,'compare-dialog');
    document.querySelectorAll('#dialog [data-frame="m04"]').forEach(updateDeposit);document.querySelectorAll('#dialog [data-frame="m05"]').forEach(updateRedeem);
  }
  document.addEventListener('click',event=>{
    const b=event.target.closest('[data-action]');if(!b||b.disabled)return;
    const a=b.dataset.action,frame=b.closest('[data-frame]');
    if(a==='collection-filter'){b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));document.querySelectorAll('.study').forEach(x=>x.hidden=b.dataset.collection!=='all'&&x.dataset.collection!==b.dataset.collection);return;}
    if(a==='close-dialog'){document.getElementById('dialog').close();return;}
    if(a==='confirm'){document.getElementById('dialog').close();if(confirmAction)confirmAction();return;}
    if(a==='print'){window.print();return;}
    if(a==='review'){dialog('A clearer product, not just a new skin.',reviewHtml,'',null,'review-dialog');return;}
    if(a==='brief'){const t=themes.find(x=>x.id===current);dialog(t.name+' · design brief',`<p>${esc(t.brief)}</p><p class="disclaimer">One shared μi layer. Seven fixed tasks. All figures and flows are illustrative. Theme changes typography, structure, density and emphasis as well as color.</p>`);return;}
    if(a==='copy-prompt'){const t=themes.find(x=>x.id===b.dataset.themeId);const text=t.brief+'\n\n'+master;if(navigator.clipboard?.writeText)navigator.clipboard.writeText(text).then(()=>toast('Complete prompt copied.')).catch(()=>dialog('Copy the complete prompt',`<textarea class="field" rows="12" aria-label="Complete generation prompt">${esc(text)}</textarea>`));else dialog('Copy the complete prompt',`<textarea class="field" rows="12" aria-label="Complete generation prompt">${esc(text)}</textarea>`);return;}
    if(a==='compare'){showComparison();return;}
    if(a==='focus-screen'){state.focus=b.dataset.target;history.replaceState(null,'',state.focus==='board'?'#board':'#'+state.focus);mount();return;}
    if(a==='go-screen'){navigate(b.dataset.target);return;}
    if(a==='pool-example'){dialog(esc(b.dataset.pair||'Pool example'),'<p>This card is included to compare the pool-list design. The complete seven-screen journey uses WETH / USDC on VeloV3 so that every direction shares the same data.</p>','Open WETH / USDC sample',()=>navigate('m03'));return;}
    if(a==='go-pools'){navigate('m02');return;}if(a==='go-pool'){navigate('m03');return;}if(a==='go-deposit'){navigate('m04');return;}if(a==='go-redeem'){navigate('m05');return;}
    if(a==='connect'||a==='wallet'){dialog('Wallet preview',`<p>${a==='connect'?'A real app would open the wallet connection flow.':'Sample wallet: 0x5610…283e. Roles are read separately from share ownership.'}</p><p class="disclaimer">This local prototype never connects a wallet, reads an account or requests a signature.</p>`);return;}
    if(a==='switch-network'){dialog('Switch network preview','<p>The wallet is shown on Ethereum while this example pool is on Base. The real app must confirm a successful network switch before enabling transaction review.</p><p class="disclaimer">No network request is made in this prototype.</p>');return;}
    if(a==='activity'){dialog('Sample activity','<dl><dt>Deposit · 18 Oct</dt><dd>0.5 WETH + 1,215.75 USDC</dd><dt>Config update · 19 Oct</dt><dd>Manager · v7</dd><dt>Withdrawal request</dt><dd>No pending Base request</dd></dl><p class="disclaimer">Illustrative activity only. No real transactions or hashes are represented.</p>');return;}
    if(a==='secondary-series'){updateSecondary(b.closest('[data-secondary-panel]'),b.dataset.series);return;}
    if(a==='range-units'){const root=b.closest('[data-ranges]');const ticks=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',ticks);root.querySelectorAll('[data-price]').forEach(x=>x.textContent=ticks?x.dataset.ticks:x.dataset.price);root.querySelector('[data-range-units]').textContent=ticks?'Tick indices':'Prices in USDC per WETH';return;}
    if(a==='equity-period'){b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));const root=b.closest('[data-equity]');root.querySelector('[data-equity-chart]').innerHTML=lineChart('equity',120,b.dataset.period);root.querySelector('[data-equity-period-label]').textContent=b.dataset.period+' illustrative series';return;}
    if(a==='price-period'){b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));updateChart(b.closest('[data-price-panel]'));return;}
    if(a==='max-amount'){frame.querySelector(`[data-amount="${b.dataset.token}"]`).value=b.dataset.max;updateDeposit(frame);return;}
    if(a==='redeem-percent'){frame.querySelector('[data-redeem-shares]').value=money(redeemBalance*Number(b.dataset.percent)/100,4);b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));updateRedeem(frame);return;}
    if(a==='redeem-mode'){state.redeemMode=b.dataset.mode;mount();return;}
    if(a==='deposit-review'){const v=updateDeposit(frame);if(!v)return;dialog('Review deposit',`<p>WETH / USDC · VeloV3 · Base</p><dl><dt>Exact WETH approval</dt><dd>${fmt(v.base,6)} WETH</dd><dt>Exact USDC approval</dt><dd>${money(v.quote)} USDC</dd><dt>Estimated shares</dt><dd>${money(v.shares,4)}</dd><dt>Minimum shares</dt><dd>${money(v.min)}</dd><dt>Deadline / fee</dt><dd>10 min / $0.42 est.</dd></dl><p class="disclaimer">Demo review only. No approval, signature or transaction will be requested.</p>`,'Finish preview',()=>toast('Deposit preview complete. No transaction was sent.'));return;}
    if(a==='redeem-review'||a==='claim-review'){const v=updateRedeem(frame);if(!v)return;dialog(a==='claim-review'?'Review settled claim':'Review withdrawal',`<p>${a==='claim-review'?'AeroCL2 · Arc · settled sample request':'VeloV3 · Base · immediate exit'}</p><dl><dt>Shares</dt><dd>${money(v.shares,4)}</dd><dt>Estimated WETH</dt><dd>${fmt(v.base,6)}</dd><dt>Estimated USDC</dt><dd>${money(v.quote)}</dd><dt>Minimum WETH / USDC</dt><dd>${fmt(v.base*.995,6)} / ${money(v.quote*.995)}</dd><dt>Deadline</dt><dd>10 minutes</dd></dl><p class="disclaimer">Demo review only. No transaction or claim will be sent.</p>`,'Finish preview',()=>toast('Withdrawal preview complete. No transaction was sent.'));return;}
    if(a==='offset'){b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));updateConfig(b.closest('[data-config]'));return;}
    if(a==='config-preview'){const root=b.closest('[data-config]');const v=updateConfig(root);root.querySelector('[data-config-state]').textContent=`Preview refreshed · base ${v.base}× ATR, limit ${v.limit}× ATR, weights ${v.weight}% / ${100-v.weight}%. Illustrative only; no engine call.`;root.querySelector('[data-config-chart]').innerHTML=lineChart('price',120,v.base>7?'All':'7D');return;}
    if(a==='config-review'){const root=b.closest('[data-config]');if(root.dataset.readonly==='true')return;const v=updateConfig(root);const enabled=root.querySelector('[data-config-enabled]').checked;const offset=root.querySelector('[data-action="offset"][aria-pressed="true"]').textContent;dialog('Review configuration',`<p>WETH / USDC · Base · manager preview</p><dl><dt>Base ATR</dt><dd>${configDefaults.base}× → ${v.base}×</dd><dt>Limit ATR</dt><dd>${configDefaults.limit}× → ${v.limit}×</dd><dt>Base / limit weight</dt><dd>${v.weight}% / ${100-v.weight}%</dd><dt>Target / tolerance</dt><dd>${v.target}% / ±${v.tolerance}%</dd><dt>Offset / enabled</dt><dd>${offset} / ${enabled?'Yes':'No'}</dd></dl><p class="disclaimer">Saving a real config would request a signature and wait for keeper pickup. This preview stores nothing remotely and does not allocate liquidity.</p>`,'Simulate save',()=>{root.querySelector('[data-config-state]').textContent='Demo config saved · waiting for keeper pickup. No signature, remote write or allocation was performed.';root.querySelector('[data-config-dirty]').textContent='Demo saved · keeper pickup pending';});return;}
    if(a==='desktop-tab'){const root=b.closest('[data-frame]');b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-selected',x===b));const host=root.querySelector('[data-workspace-chart]');if(b.dataset.tab==='Price')host.innerHTML=chartPanel();else if(b.dataset.tab==='Liquidity')host.innerHTML=`<div class="chart-block">${depthChart()}<div class="chart-axis"><span>2,156.6 USDC</span><span>Current · 2,431.5</span><span>2,741.5 USDC</span></div><p class="chart-readout">Illustrative active liquidity. Solid = base, outlined = limit.</p></div>`;else host.innerHTML=state.scenario==='history'?'<div class="loading-placeholder">Performance history unavailable. Your current position remains visible.</div>':`<div class="chart-block">${lineChart('equity')}<p class="chart-readout">Illustrative value series · 30 days · not a yield guarantee.</p></div>`;if(b.dataset.tab==='Price'&&state.scenario!=='history')updateChart(host.querySelector('[data-price-panel]'));return;}
  });
  function depthChart() {
    const bars=Array.from({length:40},(_,i)=>{const h=18+Math.exp(-(((i-21)/9)**2))*140;return `<rect x="${i*8+1}" y="${180-h}" width="6" height="${h}" fill="${i<18?'var(--n3)':'var(--ac)'}" opacity="${i>28?'.3':'.6'}"/>`;}).join('');
    return `<svg class="chart pool-chart" viewBox="0 0 320 190" role="img" aria-label="Illustrative liquidity depth">${bars}<line x1="163" x2="163" y1="0" y2="180" stroke="var(--fg)" stroke-width="1.5"/></svg>`;
  }
  document.addEventListener('input',event=>{
    const n=event.target;if(n.matches('[data-amount]'))updateDeposit(n.closest('[data-frame]'));
    if(n.matches('[data-redeem-shares]'))updateRedeem(n.closest('[data-frame]'));
    if(n.matches('[data-pool-search]'))filterPools(n.closest('[data-frame]'));
    if(n.matches('[data-config-input]'))updateConfig(n.closest('[data-config]'));
  });
  document.addEventListener('change',event=>{
    const n=event.target;
    if(n.matches('[data-phone-width]')){state.phoneWidth=Number(n.value);mount();}
    if(n.matches('[data-scenario]')){state.scenario=n.value;mount();}
    if(n.matches('[data-pool-dex],[data-pool-network]'))filterPools(n.closest('[data-frame]'));
    if(n.matches('[data-chart-type],[data-chart-bands]'))updateChart(n.closest('[data-price-panel]'));
    if(n.matches('[data-config-select],[data-config-enabled]'))updateConfig(n.closest('[data-config]'));
    if(n.matches('[data-shortlist]')){if(n.checked&&state.selected.size===3){n.checked=false;toast('Compare up to three directions. Uncheck one first.');return;}n.checked?state.selected.add(n.dataset.shortlist):state.selected.delete(n.dataset.shortlist);}
    if(n.matches('[data-comparison-screen]')){state.compareScreen=n.value;showComparison();}
  });
  document.addEventListener('keydown',event=>{
    const chart=event.target.closest('[data-price-chart]');if(!chart||!['ArrowLeft','ArrowRight'].includes(event.key))return;
    event.preventDefault();const i=Math.max(0,Math.min(33,Number(chart.dataset.cursor||16)+(event.key==='ArrowRight'?1:-1)));chart.dataset.cursor=i;
    const p=2400+Math.sin(i*.38)*30+i;chart.closest('[data-price-panel]').querySelector('[data-chart-readout]').textContent=`Sample candle ${i+1}/34 · ${money(p)} USDC · base ${i<8?'projected':'sample allocation'}.`;
  });
  document.getElementById('dialog').addEventListener('click',event=>{if(event.target.id!=='dialog')return;const r=event.target.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)event.target.close();});
  window.addEventListener('hashchange',()=>{if(!current)return;state.focus=/^#(m0[1-5]|d0[12])$/.test(location.hash)?location.hash.slice(1):'board';mount();});
  if(current && /^#(m0[1-5]|d0[12])$/.test(location.hash))state.focus=location.hash.slice(1);
  mount();
})();

</script></body></html>
