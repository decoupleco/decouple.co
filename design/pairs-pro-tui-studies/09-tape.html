arden","commit":"1e5196cf9167e74c3a4fafb5be964cb15a3dc299","file":"colors.toml","url":"https://github.com/celsobenedetti/omarchy-evergarden/blob/1e5196cf9167e74c3a4fafb5be964cb15a3dc299/colors.toml"},{"repo":"thmoee/omarchy-vesper-theme","commit":"427bb540bdba152cd48f7f1e4274f96a11cd591e","file":"alacritty.toml","url":"https://github.com/thmoee/omarchy-vesper-theme/blob/427bb540bdba152cd48f7f1e4274f96a11cd591e/alacritty.toml"},{"repo":"Swarnim114/omarchy-monochrome-theme","commit":"10aa54d4b31284f24d73c5aa5532795f4bc85046","file":"alacritty.toml","url":"https://github.com/Swarnim114/omarchy-monochrome-theme/blob/10aa54d4b31284f24d73c5aa5532795f4bc85046/alacritty.toml"}];window.TUI_DIRECTIONS=[{"id":"01-flightdeck","name":"Flightdeck","type":"Instrument stack","group":"Dense","layout":"flightdeck","bg":"#0d121a","panel":"#121a25","line":"#2b3a4c","fg":"#e2e9f1","muted":"#98a8bc","accent":"#78aaff","positive":"#80c9ae","negative":"#e79a9b","fee":"#ecc178","brief":"The clearest evolution of the current TUI: one tall price pane, three aligned instrument strips, and a persistent now/end inspector.","tradeoff":"Best all-rounder. An inspector costs chart width.","rank":"Recommended","set":"default","adjustments":[]},{"id":"02-split","name":"Split screen","type":"Dual monitor","group":"Dense","layout":"split","bg":"#101815","panel":"#17221d","line":"#35483d","fg":"#e3ebe6","muted":"#a1b4a7","accent":"#9adaac","positive":"#9adaac","negative":"#e9a8a1","fee":"#e5ce93","brief":"Give price and value equal weight. Read market action on the left and the strategy’s response on the right; exposure and fee strips sit directly beneath.","tradeoff":"Fast cause-and-effect comparison. Less vertical space for price.","set":"default","adjustments":[]},{"id":"03-ledger","name":"Ledger","type":"Accountant’s console","group":"Dense","layout":"ledger","bg":"#191713","panel":"#211f19","line":"#494335","fg":"#ece7db","muted":"#b6ae9b","accent":"#e9c37d","positive":"#b4cfaa","negative":"#e9a59a","fee":"#e9c37d","brief":"Start with the numbers. A fixed left ledger anchors current performance while a chart stack explains it, with fees and divergence kept explicit.","tradeoff":"Excellent for attribution. Metrics lead the eye before the market.","set":"default","adjustments":[]},{"id":"04-rail","name":"Event rail","type":"Replay debugger","group":"Dense","layout":"rail","bg":"#18151d","panel":"#211b29","line":"#48384f","fg":"#ebe3ef","muted":"#b9a7c1","accent":"#cba6ee","positive":"#a8d4bd","negative":"#efa1b3","fee":"#e5c68b","brief":"Place a timestamped rebalance rail beside the price stack. Every event is a navigation target, so the replay feels like stepping through a debugger.","tradeoff":"Strong for reviewing decisions. The event rail needs a wide terminal.","set":"default","adjustments":[]},{"id":"05-paper","name":"Lab paper","type":"Light research terminal","group":"Light","layout":"paper","bg":"#f4f1e8","panel":"#f4f1e8","line":"#c6c2b5","fg":"#272e2b","muted":"#61675f","accent":"#2f5a85","positive":"#32634b","negative":"#974f48","fee":"#886223","brief":"A light, ink-on-paper research layout: price and value to the left, exposure and fees to the right, with a ruled audit trail below.","tradeoff":"Good for daylight and screenshots. Fewer dark/light exposure shades.","set":"default","adjustments":[]},{"id":"06-focus","name":"Quiet focus","type":"Single question","group":"Focused","layout":"focus","bg":"#101918","panel":"#14201f","line":"#314845","fg":"#e0ece7","muted":"#a0b6ae","accent":"#9acdbb","positive":"#9acdbb","negative":"#e5a6a2","fee":"#dfc693","brief":"Protect the price chart. Show only one secondary instrument at a time and keep the inspector slim. Designed for deliberate keyboard-led replay.","tradeoff":"Lowest cognitive load. Secondary charts require a switch.","rank":"Shortlist","set":"default","adjustments":[]},{"id":"07-race","name":"Lap timer","type":"Benchmark first","group":"Focused","layout":"race","bg":"#10161c","panel":"#151f28","line":"#30414e","fg":"#deebef","muted":"#9cafbc","accent":"#77cfdf","positive":"#9cceba","negative":"#e6a5ab","fee":"#e5c88c","brief":"Make the race against HODL the hero. A large value pane comes first; price, exposure and fees explain the gap beneath it.","tradeoff":"Best for benchmark questions. Price is intentionally secondary.","set":"default","adjustments":[]},{"id":"08-matrix","name":"Matrix","type":"Four equal instruments","group":"Dense","layout":"matrix","bg":"#161a22","panel":"#1b202b","line":"#374355","fg":"#e3e7f1","muted":"#a6b0c4","accent":"#a2b7f5","positive":"#a6d0b5","negative":"#e8a5ae","fee":"#dfc398","brief":"Use a strict two-by-two instrument grid with a shared time window. Read each plot independently without changing the panel arrangement.","tradeoff":"Predictable scanning. Price loses its visual priority.","set":"default","adjustments":[]},{"id":"09-tape","name":"Amber tape","type":"Market desk","group":"Dense","layout":"tape","bg":"#16140f","panel":"#201c14","line":"#493e2a","fg":"#eee5d3","muted":"#bdb095","accent":"#edc281","positive":"#b9cca7","negative":"#e7aaa0","fee":"#edc281","brief":"A compact quote board above a wide price chart, a right-hand event tape, and three narrow lower instruments. Restrained amber without CRT effects.","tradeoff":"Efficient at 160 columns. Lower charts become small at 100.","set":"default","adjustments":[]},{"id":"10-outline","name":"Outline","type":"Monochrome workbench","group":"Light","layout":"outline","bg":"#eaeef0","panel":"#eaeef0","line":"#b5c0c7","fg":"#26323c","muted":"#596976","accent":"#345b83","positive":"#38664e","negative":"#9b4e57","fee":"#806121","brief":"A restrained, almost monochrome console. A full-width price chart sits above a three-instrument row, with key results in a narrow ruled footer.","tradeoff":"Easy to port to basic terminals. Meaning relies on labels and line patterns.","rank":"Shortlist","set":"default","adjustments":[]},{"id":"01-bauhaus","name":"Bauhaus","type":"Geometric instrument grid","group":"Dense","layout":"matrix","bg":"#101318","panel":"#161b22","line":"#3a3f4c","fg":"#eaeff5","muted":"#c6ced8","accent":"#e37b66","positive":"#789fa2","negative":"#cb886d","fee":"#e7a46f","sourceIndex":0,"brief":"Coral, sand and cool slate in a strict four-pane grid. Equal instrument weights and numbered headers make the composition feel measured and architectural.","tradeoff":"Best for scanning equal instruments. The price pane gives up visual priority.","adjustments":[],"set":"omar"},{"id":"02-gruvbox-material","name":"Gruvbox Material","type":"Warm results ledger","group":"Dense","layout":"ledger","bg":"#282828","panel":"#282828","line":"#45403d","fg":"#d4be98","muted":"#a89984","accent":"#e78a4e","positive":"#a9b665","negative":"#ea6962","fee":"#d8a657","sourceIndex":1,"brief":"Warm charcoal, parchment text and orange commands. A fixed left ledger keeps results in view while the chart stack explains where the return came from.","tradeoff":"Strong for long attribution sessions. The ledger uses a third of the width.","adjustments":[],"set":"omar"},{"id":"03-rose-pine-moon","name":"Rosé Pine Moon","type":"Soft split workspace","group":"Dense","layout":"split","bg":"#232136","panel":"#232136","line":"#393552","fg":"#e0def4","muted":"#908caa","accent":"#9ccfd8","positive":"#ea9a97","negative":"#eb6f92","fee":"#f6c177","sourceIndex":2,"brief":"Moonlit violet with foam, rose and gold. Price and portfolio value share the top row, keeping market movement and strategy response in a single glance.","tradeoff":"A calm comparison workspace. Less height for the price chart.","adjustments":[],"set":"omar"},{"id":"04-flexoki-dark","name":"Flexoki Dark","type":"Ink workbench","group":"Dense","layout":"outline","bg":"#100f0f","panel":"#100f0f","line":"#403e3c","fg":"#cecdc3","muted":"#878580","accent":"#4385be","positive":"#879a39","negative":"#d25145","fee":"#d0a215","sourceIndex":3,"brief":"Almost-black ink, warm paper text and selective blue. A wide price pane sits above three ruled instruments; restrained accents carry only active information.","tradeoff":"Clear visual hierarchy with little color noise. Some source hues need brighter text variants.","adjustments":[{"role":"negative","original":"#d14d41","adjusted":"#d25145"}],"set":"omar"},{"id":"05-catppuccin-dark","name":"Catppuccin Dark","type":"Pastel event workspace","group":"Dense","layout":"rail","bg":"#010101","panel":"#010101","line":"#45475a","fg":"#cdd6f4","muted":"#bac2de","accent":"#89b4fa","positive":"#a6e3a1","negative":"#f38ba8","fee":"#f9e2af","sourceIndex":4,"brief":"The selected community port uses a near-black background with Mocha pastels. A timestamp rail makes rebalances the entry points into a blue-led chart stack.","tradeoff":"Good for decision-by-decision replay. The rail benefits from 120 columns or more.","adjustments":[],"set":"omar"},{"id":"06-cobalt2","name":"Cobalt2","type":"Blue and gold flightdeck","group":"Dense","layout":"flightdeck","bg":"#122738","panel":"#193549","line":"#0050a4","fg":"#ffffff","muted":"#aaaaaa","accent":"#ffc600","positive":"#3ad900","negative":"#ff648d","fee":"#ff9d00","sourceIndex":5,"brief":"Deep blue panes, a gold active edge and white readouts. Price remains the hero; value, exposure and fees align underneath, beside a persistent results inspector.","tradeoff":"The strongest instrument hierarchy. Gold is reserved for selection and the strategy line.","rank":"Shortlist","adjustments":[{"role":"negative","original":"#ff628c","adjusted":"#ff648d"}],"set":"omar"},{"id":"07-solarized-light","name":"Solarized Light","type":"Daylight research sheet","group":"Light","layout":"paper","bg":"#fdf6e3","panel":"#eee8d5","line":"#93a1a1","fg":"#566c73","muted":"#586b72","accent":"#1e6ca4","positive":"#606e00","negative":"#c42d2a","fee":"#846400","sourceIndex":6,"brief":"Cream paper, blue ink and restrained ochre. A light research sheet places price and value beside exposure and fee instruments, with a ruled event hi ising candles, solid falling candles, line patterns and exposure hatching preserve distinctions without hue.","tradeoff":"Useful for low-color terminals and contrast review. Pattern and label design must carry every distinction.","adjustments":[{"role":"muted","original":"#888888","adjusted":"#8e8e8e"},{"role":"negative","original":"#888888","adjusted":"#8e8e8e"}],"set":"omar"}];window.TUI_FIXTURE=[{"i":0,"time":"2025-11-01T00:00:00.000Z","open":110400,"close":110431,"high":110831,"low":109200,"nav":100,"hodl":100,"hodl100":100,"exposure":0.51,"idle":0.1,"fee":2.4499999999999997,"rebalance":false,"baseLow":90000,"baseHigh":123000,"limitLow":98000,"limitHigh":117000},{"i":1,"time":"2025-11-01T04:00:00.000Z","open":110431,"close":111225.9534230308,"high":112488.98527022763,"low":109239.50637788961,"nav":101.65366246229347,"hodl":101.4104273571024,"hodl100":101.07273684210526,"exposure":0.528206104018171,"idle":0.10273684210526317,"fee":1.3658012112483617,"rebalance":false,"baseLow":90000,"baseHigh":123000,"limitLow":98000,"limitHigh":117000},{"i":2,"time":"2025-11-01T08:00:00.000Z","open":111225.9534230308,"close":111954.1936514614,"high":112843.81265126183,"low":110059.808679378,"nav":103.28613602226132,"hodl":102.79756333883874,"hodl100":102.14547368421053,"exposure":0.5460745506229534,"idle":0.10547368421052632,"fee":0.1500236390195182,"rebalance":false,"baseLow":90000,"baseHigh":123000,"limitLow":98000,"limitHigh":117000},{"i":3,"time":"2025-11-01T12:00:00.000Z","open":111954.1936514614,"close":112556.1371246387,"high":113541.39618078011,"low":110829.73292885943,"nav":104.89243132296686,"hodl":104.15694174481361,"hodl100":103.21821052631579,"exposure":0.5634835274864225,"idle":0.10821052631578948,"fee":0.8516747741082127,"rebalance":false,"baseLow":90000,"baseHigh":123000,"limitLow":98000,"limitHigh":117000},{"i":4,"time":"2025-11-01T16:00:00.000Z","open":112556.1371246387,"close":112985.66152787255,"high":114207.31225352742,"low":111488.86125971608,"nav":106.4678 function render(keepFocus=false){const active=keepFocus||document.activeElement?.classList.contains('terminal');$('#stage').innerHTML=terminal(theme,state);$('#cursor').value=state.cursor;$('#cursor-label').textContent=date(F[state.cursor])+' UTC';$('#play').textContent=state.playing?'Ⅱ Pause':'▶ Play';$('#info').setAttribute('aria-pressed',String(state.info||['flightdeck','ledger','focus'].includes(theme.layout)&&!state.infoClosed));$('#pnl').setAttribute('aria-pressed',String(state.pnl));const term=$('#stage .terminal');term.onclick=e=>{if(!e.target.closest('button'))term.focus({preventScroll:true})};term.onkeydown=key;$$('[data-action="close-overlay"]').forEach(b=>b.onclick=()=>act('close-overlay'));$$('[data-jump]').forEach(b=>b.onclick=()=>{state.cursor=Number(b.dataset.jump);state.overlay=null;state.playing=false;render(true)});if(active)term.focus({preventScroll:true});clearInterval(timer);if(state.playing)timer=setInterval(()=>{if(state.cursor>=95){state.playing=false}else state.cursor++;render()},state.speed===1?700:state.speed===2?200:70)}
